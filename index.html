<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAR COST｜車の維持費シミュレーター</title>
<meta name="description" content="車の年間・月間維持費をかんたんに計算できる無料シミュレーター。">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#1d4ed8;--soft:#eff6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.container{max-width:980px;margin:auto;padding:24px}
header{padding:28px 0 10px}.brand{font-weight:800;letter-spacing:.04em;font-size:15px;color:var(--accent)}
h1{font-size:clamp(28px,5vw,48px);line-height:1.15;margin:10px 0}.lead{color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 28px rgba(17,24,39,.05)}
h2{font-size:20px;margin:0 0 18px}.field{margin:0 0 15px}label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:7px}
small{font-weight:400;color:var(--muted)}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}
input:focus,select:focus{outline:3px solid #dbeafe;border-color:var(--accent)}
select{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}
.fuelbox{background:var(--soft);border:1px solid #bfdbfe;border-radius:14px;padding:14px;margin:4px 0 16px}
.fuelbox span{display:block;font-size:12px;color:var(--muted)}
.fuelbox strong{display:block;font-size:28px;margin:2px 0}
.fuelbox small{display:block;color:var(--muted);font-size:11px}
button{width:100%;border:0;border-radius:13px;padding:14px 16px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
button:hover{background:var(--accent2)}
.result{background:linear-gradient(135deg,#eff6ff,#fff);border:1px solid #bfdbfe}
.big{font-size:38px;font-weight:900;margin:5px 0 18px}.unit{font-size:14px;font-weight:600;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{display:block;font-size:21px;margin-top:4px}
.breakdown{margin-top:18px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border-bottom:0;font-weight:800}
.note{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0}
@media(max-width:760px){.container{padding:18px}.grid{grid-template-columns:1fr}.card{padding:19px}header{padding-top:18px}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="brand">CAR COST</div>
  <h1>あなたの車、<br>1ヶ月いくらかかってる？</h1>
  <p class="lead">税金・保険・ガソリン・車検・駐車場・ローンまで入れて、車の維持費をまとめて計算。</p>
</header>

<div class="grid">
<section class="card">
<h2>車の条件</h2>
<div class="field"><label for="maker">メーカー</label>
<select id="maker"><option value="toyota">トヨタ</option><option value="honda">ホンダ</option><option value="nissan">日産</option></select></div>
<div class="field"><label for="model">車種</label>
<select id="model"><option>読み込み中…</option></select></div>
<div class="field"><label for="grade">グレード・タイプ</label>
<select id="grade"><option>読み込み中…</option></select></div>
<div class="fuelbox"><span>推定実燃費</span><strong id="fuelEstimate">—</strong><small>公開されているユーザー燃費情報などを参考にした目安</small></div>
<div class="field"><label>年間走行距離 <small>km / 年</small></label><input id="distance" type="number" value="10000" min="0"></div>
<div class="field"><label>実燃費 <small>km / L</small></label><input id="fuelEff" type="number" value="15" min="0.1" step="0.1"></div>
<div class="field"><label>ガソリン価格 <small>円 / L</small></label><input id="fuelPrice" type="number" value="175" min="0"></div>
<div class="field"><label>自動車税 <small>円 / 年</small></label><input id="tax" type="number" value="30500" min="0"></div>
<div class="field"><label>任意保険 <small>円 / 年</small></label><input id="insurance" type="number" value="120000" min="0"></div>
<div class="field"><label>車検・整備積立 <small>円 / 年</small></label><input id="inspection" type="number" value="70000" min="0"></div>
<div class="field"><label>駐車場 <small>円 / 月</small></label><input id="parking" type="number" value="10000" min="0"></div>
<div class="field"><label>ローン・リース <small>円 / 月</small></label><input id="loan" type="number" value="0" min="0"></div>
<button onclick="calc()">維持費を計算する</button>
</section>

<section class="card result">
<h2>シミュレーション結果</h2>
<div class="unit">年間維持費</div>
<div class="big" id="annual">—</div>
<div class="stats">
  <div class="stat"><span class="unit">月間</span><b id="monthly">—</b></div>
  <div class="stat"><span class="unit">1日あたり</span><b id="daily">—</b></div>
  <div class="stat"><span class="unit">1kmあたり</span><b id="perkm">—</b></div>
  <div class="stat"><span class="unit">5年間</span><b id="fiveyear">—</b></div>
</div>
<div class="breakdown">
  <div class="row"><span>ガソリン</span><b id="fuel">—</b></div>
  <div class="row"><span>自動車税</span><b id="taxOut">—</b></div>
  <div class="row"><span>任意保険</span><b id="insOut">—</b></div>
  <div class="row"><span>車検・整備</span><b id="inspOut">—</b></div>
  <div class="row"><span>駐車場</span><b id="parkOut">—</b></div>
  <div class="row"><span>ローン・リース</span><b id="loanOut">—</b></div>
</div>
<p class="note">※試算値です。実際の税金・保険料・車検費用・燃費などは車種や契約条件、走行状況によって変わります。</p>
</section>
</div>
<footer>CAR COST — 車のお金を、もっと分かりやすく。</footer>
</div>

  const grades = vehicles[maker.value]?.[model.value] || {};

  grade.innerHTML = "";

  Object.entries(grades).forEach(([name, fuel]) => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    option.dataset.fuel = fuel;
    grade.appendChild(option);
  });

  updateFuel();
}

function updateFuel() {
  const fuel = Number(grade.selectedOptions[0]?.dataset.fuel || 0);

  if (fuel > 0) {
    fuelEstimate.textContent = fuel.toFixed(1) + " km/L";
    fuelEff.value = fuel;
  } else {
    fuelEstimate.textContent = "EV";
  }
}

maker.addEventListener("change", updateModels);
model.addEventListener("change", updateGrades);
grade.addEventListener("change", updateFuel);

function yen(n) {
  return "¥" + Math.round(n).toLocaleString("ja-JP");
}

function calc() {
  const distance = Number(document.getElementById("distance").value);
  const fuel = Number(document.getElementById("fuelEff").value);
  const fuelPrice = Number(document.getElementById("fuelPrice").value);
  const tax = Number(document.getElementById("tax").value);
  const insurance = Number(document.getElementById("insurance").value);
  const inspection = Number(document.getElementById("inspection").value);
  const parking = Number(document.getElementById("parking").value);
  const loan = Number(document.getElementById("loan").value);

  const gasoline = fuel > 0
    ? (distance / fuel) * fuelPrice
    : 0;

  const parkingYear = parking * 12;
  const loanYear = loan * 12;

  const annual =
    gasoline +
    tax +
    insurance +
    inspection +
    parkingYear +
    loanYear;

  document.getElementById("annual").textContent = yen(annual);
  document.getElementById("monthly").textContent = yen(annual / 12);
  document.getElementById("daily").textContent = yen(annual / 365);
  document.getElementById("perkm").textContent =
    distance > 0 ? yen(annual / distance) : "¥0";
  document.getElementById("fiveyear").textContent = yen(annual * 5);

  document.getElementById("fuel").textContent = yen(gasoline);
  document.getElementById("taxOut").textContent = yen(tax);
  document.getElementById("insOut").textContent = yen(insurance);
  document.getElementById("inspOut").textContent = yen(inspection);
  document.getElementById("parkOut").textContent = yen(parkingYear);
  document.getElementById("loanOut").textContent = yen(loanYear);
}

updateModels();
calc();
</script>
